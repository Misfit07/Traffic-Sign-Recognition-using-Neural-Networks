[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tlc"
version = "0.1.0"
description = "Production-grade black-box traffic light red classifier"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "pillow>=9.5.0",
    "onnxruntime>=1.15.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "onnx>=1.14.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
tlc = "tlc.cli:main"

[tool.setuptools.packages.find]
include = ["tlc*"]

[tool.setuptools.package-data]
"tlc.models" = ["*.onnx", "*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
